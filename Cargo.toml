[package]
name = "bulut"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "bulut"
path = "src/lib.rs"

[[bin]]
name = "bulut"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
