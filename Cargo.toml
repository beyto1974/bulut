[package]
name = "bulut"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "A small dropbox for sessions, with short links, a REST API, llms.txt and MCP."
repository = "https://github.com/beyto1974/bulut"

[lib]
name = "bulut"
path = "src/lib.rs"

[[bin]]
name = "bulut"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
rand = "0.8"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
qrcode = { version = "0.14", default-features = false }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-aws-lc"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
dotenvy = "0.15"
rqrr = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
