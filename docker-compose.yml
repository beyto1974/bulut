services:
  backend:
    build: .
    image: bulut:dev
    env_file: .env
    environment:
      PORT: "8080"
      # Short links and the QR code use this, so it should match how the app is reached.
      BASE_URL: ${BASE_URL:-http://localhost:${HOST_PORT}}
    ports:
      - "127.0.0.1:${HOST_PORT:?set HOST_PORT in .env to a free port}:8080"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
# Development compose file: Postgres and S3 are not part of it, point DATABASE_URL and the S3_* settings in
# .env at existing services. For a complete stack with both, see examples/docker-compose.yml.
