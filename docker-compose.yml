services:
  backend:
    build: .
    image: bulut:dev
    env_file: .env
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
# Postgres and S3 come from the shared dev services (devdb / devgarage), so no db or garage service is
# defined for development. Start with: docker compose up -d --no-deps backend
